<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07080f" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- PWA & Mobile Home Screen Display Name -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GlitchFix" />
    <meta name="application-name" content="GlitchFix" />
    
    <!-- Apple Touch Icons for iOS Home Screen -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="<!--static-seo:description-->" />
    <title><!--static-seo:title--></title>
<!--static-seo:head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@600;700;800&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Neon Splash Screen Critical Styles ───────────────────────────────── */
      #glitchfix-splash {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #06070f;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: pointer;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform, filter;
      }

      #glitchfix-splash.gf-exit {
        opacity: 0;
        transform: scale(1.06);
        filter: blur(10px);
        pointer-events: none;
      }

      /* Cyber grid background */
      .gf-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at 50% 50%, black 25%, transparent 75%);
        -webkit-mask-image: radial-gradient(circle at 50% 50%, black 25%, transparent 75%);
        pointer-events: none;
      }

      /* Ambient Neon Aurora Orbs */
      .gf-aurora-cyan {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-65%, -50%);
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, rgba(0, 240, 255, 0) 70%);
        filter: blur(40px);
        animation: gf-pulse-cyan 3.2s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .gf-aurora-purple {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-35%, -30%);
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 70, 239, 0.2) 0%, rgba(139, 92, 246, 0) 70%);
        filter: blur(45px);
        animation: gf-pulse-purple 3.8s ease-in-out infinite alternate;
        pointer-events: none;
      }

      /* Holographic Scanline Wave */
      .gf-scanline {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
        animation: gf-scan 2.6s linear infinite;
        opacity: 0.6;
        pointer-events: none;
      }

      /* Center Content */
      .gf-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }

      /* Neon Logo Emblem */
      .gf-logo-box {
        --gf-logo: 104px;
        position: relative;
        width: var(--gf-logo);
        height: var(--gf-logo);
        margin-bottom: 24px;
        animation: gf-ignition 1.1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      }

      .gf-logo-halo {
        position: absolute;
        inset: -12px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.35), rgba(217, 70, 239, 0.35));
        filter: blur(18px);
        opacity: 0.8;
        animation: gf-halo-breathe 2.4s ease-in-out infinite alternate;
      }

      .gf-logo-svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 24px;
        object-fit: cover;
        filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 30px rgba(217, 70, 239, 0.5));
      }

      /* Neon Titles */
      .gf-brand-en {
        margin: 0;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #ffffff;
        text-indent: 0.22em;
        text-shadow:
          0 0 6px #ffffff,
          0 0 14px #00f0ff,
          0 0 28px #00f0ff,
          0 0 55px #0284c7,
          0 0 85px #0369a1;
        animation: gf-neon-glow-cyan 2.2s ease-in-out infinite alternate,
                   gf-text-flicker 1.4s ease forwards;
      }

      .gf-brand-ar {
        margin: 8px 0 0 0;
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        font-size: 21px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.04em;
        text-shadow:
          0 0 5px #ffffff,
          0 0 12px #f43f5e,
          0 0 26px #d946ef,
          0 0 50px #8b5cf6;
        animation: gf-neon-glow-magenta 2.6s ease-in-out infinite alternate;
      }

      /* Cyber Tagline Pill */
      .gf-tagline-chip {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 14px;
        border-radius: 9999px;
        background: rgba(8, 12, 28, 0.75);
        border: 1px solid rgba(0, 240, 255, 0.3);
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(0, 240, 255, 0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .gf-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #00f0ff;
        box-shadow: 0 0 8px #00f0ff, 0 0 14px #00f0ff;
        animation: gf-blink 1.2s infinite;
      }

      .gf-tagline-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #a5f3fc;
        text-transform: uppercase;
      }

      /* Neon Laser Progress Track */
      .gf-laser-track {
        margin-top: 24px;
        width: 210px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
      }

      .gf-laser-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, #00f0ff, #818cf8, #f43f5e);
        box-shadow: 0 0 12px #00f0ff, 0 0 20px #d946ef;
        border-radius: 9999px;
        transform: scaleX(0);
        transform-origin: left center;
        animation: gf-laser-fill 2.8s cubic-bezier(0.3, 0.6, 0.3, 1) forwards;
      }

      /* Skip hint */
      .gf-hint {
        margin-top: 20px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.05em;
        font-family: 'Inter', sans-serif;
      }

      /* ── Intro story: client papers stream into the emblem, then code writes itself ──
         Everything below animates transform/opacity only (compositor-friendly, so it stays smooth
         while the app bundle parses). Text layers sit above the papers via DOM order. */
      .gf-brand-en,
      .gf-brand-ar,
      .gf-tagline-chip {
        position: relative;
      }

      /* Documents flying in */
      .gf-papers {
        --gf-dx: clamp(110px, 32vw, 300px);
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .gf-paper-slot {
        --d: 1.3s;
        position: absolute;
        inset: 0;
      }

      /* Ripple on the emblem at the moment a paper lands */
      .gf-paper-slot::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 28px;
        border: 1.5px solid rgba(var(--c), 0.7);
        box-shadow: 0 0 14px rgba(var(--c), 0.45);
        opacity: 0;
        animation: gf-landing var(--d) var(--delay) linear infinite both;
      }

      /* Outer layer travels on X (ease-in: slow start, pulled in at the end) and shrinks;
         the inner layer travels on Y with its own easing, which bends the path into an arc. */
      .gf-paper {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 38px;
        margin: -19px 0 0 -15px;
        will-change: transform;
        animation: gf-paper-x var(--d) var(--delay) cubic-bezier(0.5, 0, 0.85, 0.5) infinite both;
      }

      .gf-paper > i {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
        border: 1px solid rgba(var(--c), 0.6);
        box-shadow: 0 0 12px rgba(var(--c), 0.4), inset 0 0 8px rgba(var(--c), 0.15);
        will-change: transform, opacity;
        animation: gf-paper-y var(--d) var(--delay) cubic-bezier(0.2, 0.7, 0.3, 1) infinite both,
                   gf-paper-fade var(--d) var(--delay) linear infinite both;
      }

      /* Text lines on the sheet */
      .gf-paper > i::before {
        content: '';
        position: absolute;
        inset: 8px 5px 5px;
        background:
          linear-gradient(rgba(var(--c), 0.95) 0 0) 0 0 / 55% 2px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.6) 0 0) 0 6px / 100% 2px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.45) 0 0) 0 11px / 100% 2px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.45) 0 0) 0 16px / 78% 2px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.35) 0 0) 0 21px / 90% 2px no-repeat;
      }

      /* Sheet with a picture block instead of a headline */
      .gf-paper--img > i::before {
        background:
          linear-gradient(rgba(var(--c), 0.45) 0 0) 0 0 / 100% 11px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.55) 0 0) 0 15px / 100% 2px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.4) 0 0) 0 20px / 70% 2px no-repeat;
      }

      /* Folded corner */
      .gf-paper > i::after {
        content: '';
        position: absolute;
        top: -1px;
        right: -1px;
        width: 10px;
        height: 10px;
        border-radius: 0 4px 0 3px;
        background: linear-gradient(225deg, #06070f 50%, rgba(var(--c), 0.75) 50%);
      }

      /* Code window that types itself */
      .gf-code {
        position: relative;
        width: min(320px, calc(100vw - 48px));
        margin-top: 20px;
        border-radius: 12px;
        background: rgba(8, 12, 28, 0.8);
        border: 1px solid rgba(0, 240, 255, 0.24);
        box-shadow: 0 0 26px rgba(0, 240, 255, 0.12), 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 0 18px rgba(129, 140, 248, 0.07);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        direction: ltr;
        text-align: left;
        opacity: 0;
        transform: translateY(10px);
        animation: gf-code-in 0.6s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .gf-code-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }

      .gf-code-bar i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f43f5e;
        opacity: 0.85;
      }

      .gf-code-bar i:nth-child(2) { background: #fbbf24; }
      .gf-code-bar i:nth-child(3) { background: #34d399; }

      .gf-code-file {
        margin-left: 8px;
        font: 600 10px/1 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.06em;
        color: rgba(165, 243, 252, 0.65);
      }

      /* Fixed height (4 lines) so the layout never shifts while typing */
      .gf-code-body {
        box-sizing: border-box;
        height: calc(1.7em * 4 + 22px);
        padding: 10px 12px 12px;
        overflow: hidden;
        font: 500 11px/1.7 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e0e7ff;
        white-space: pre;
      }

      .gf-code-line {
        display: flex;
        min-height: 1.7em;
      }

      .gf-ln {
        flex: 0 0 20px;
        color: rgba(148, 163, 184, 0.4);
        user-select: none;
        -webkit-user-select: none;
      }

      .gf-code-text { min-width: 0; }
      .gf-code .k { color: #e879f9; }
      .gf-code .f { color: #67e8f9; }
      .gf-code .v { color: #e0e7ff; }
      .gf-code .p { color: #94a3b8; }
      .gf-code .s { color: #fbbf24; }
      .gf-code .ok { color: #34d399; }

      .gf-caret {
        display: inline-block;
        width: 6px;
        height: 1.15em;
        margin-left: 1px;
        vertical-align: -0.2em;
        background: #00f0ff;
        box-shadow: 0 0 8px #00f0ff;
        animation: gf-caret 1s step-end infinite;
      }

      /* Small / short screens: keep the whole story on screen */
      @media (max-width: 340px) {
        .gf-code-body { font-size: 10px; }
      }

      @media (max-height: 620px) {
        .gf-logo-box { --gf-logo: 80px; margin-bottom: 16px; }
        .gf-brand-en { font-size: 28px; }
        .gf-brand-ar { font-size: 18px; }
        .gf-tagline-chip { margin-top: 12px; }
        .gf-code { margin-top: 14px; }
        .gf-laser-track { margin-top: 18px; }
        .gf-hint { display: none; }
      }

      @media (max-height: 480px) {
        .gf-tagline-chip { display: none; }
      }

      @media (max-height: 380px) {
        .gf-code { display: none; }
      }

      /* Reduced motion: a calm static splash with the finished code, no flying papers */
      @media (prefers-reduced-motion: reduce) {
        #glitchfix-splash *,
        #glitchfix-splash *::before,
        #glitchfix-splash *::after {
          animation: none !important;
        }
        .gf-papers,
        .gf-scanline { display: none; }
        .gf-code { opacity: 1; transform: none; }
        .gf-laser-bar { transform: none; }
      }

      /* Keyframe Animations */
      @keyframes gf-scan {
        0% { top: -20px; }
        100% { top: 105%; }
      }

      @keyframes gf-pulse-cyan {
        0% { transform: translate(-65%, -50%) scale(0.9); opacity: 0.25; }
        100% { transform: translate(-60%, -45%) scale(1.15); opacity: 0.45; }
      }

      @keyframes gf-pulse-purple {
        0% { transform: translate(-35%, -30%) scale(0.9); opacity: 0.22; }
        100% { transform: translate(-40%, -35%) scale(1.18); opacity: 0.42; }
      }

      @keyframes gf-halo-breathe {
        0% { transform: scale(0.96); opacity: 0.6; filter: blur(14px); }
        100% { transform: scale(1.08); opacity: 0.95; filter: blur(22px); }
      }

      @keyframes gf-ignition {
        0% { transform: scale(0.85); opacity: 0; }
        20% { transform: scale(0.95); opacity: 0.4; }
        35% { transform: scale(0.9); opacity: 0.2; }
        55% { transform: scale(1.03); opacity: 0.95; }
        70% { transform: scale(0.98); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes gf-text-flicker {
        0% { opacity: 0; }
        15% { opacity: 0.8; }
        25% { opacity: 0.3; }
        40% { opacity: 1; }
        55% { opacity: 0.7; }
        70% { opacity: 1; }
        100% { opacity: 1; }
      }

      @keyframes gf-neon-glow-cyan {
        0% {
          text-shadow:
            0 0 6px #ffffff,
            0 0 12px #00f0ff,
            0 0 24px #00f0ff,
            0 0 45px #0284c7;
        }
        100% {
          text-shadow:
            0 0 8px #ffffff,
            0 0 18px #00f0ff,
            0 0 36px #00f0ff,
            0 0 68px #0284c7,
            0 0 95px #0369a1;
        }
      }

      @keyframes gf-neon-glow-magenta {
        0% {
          text-shadow:
            0 0 5px #ffffff,
            0 0 10px #f43f5e,
            0 0 22px #d946ef,
            0 0 40px #8b5cf6;
        }
        100% {
          text-shadow:
            0 0 7px #ffffff,
            0 0 14px #f43f5e,
            0 0 30px #d946ef,
            0 0 55px #8b5cf6;
        }
      }

      @keyframes gf-laser-fill {
        0% { transform: scaleX(0); }
        35% { transform: scaleX(0.42); }
        70% { transform: scaleX(0.78); }
        100% { transform: scaleX(1); }
      }

      @keyframes gf-blink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }

      @keyframes gf-paper-x {
        from { transform: translate3d(var(--sx), 0, 0) scale(1); }
        to { transform: translate3d(0, 0, 0) scale(0.25); }
      }

      @keyframes gf-paper-y {
        from { transform: translate3d(0, var(--sy), 0) rotate(var(--rot)); }
        to { transform: translate3d(0, 0, 0) rotate(0deg); }
      }

      @keyframes gf-paper-fade {
        0% { opacity: 0; }
        14% { opacity: 1; }
        82% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes gf-landing {
        0%, 80% { opacity: 0; transform: scale(0.92); }
        88% { opacity: 0.6; }
        100% { opacity: 0; transform: scale(1.28); }
      }

      @keyframes gf-code-in {
        to { opacity: 1; transform: none; }
      }

      @keyframes gf-caret {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <noscript>
      <!-- Without JavaScript nothing would ever dismiss the splash, so never show it. -->
      <style>#glitchfix-splash { display: none !important; }</style>
    </noscript>

    <script>
      // Apply theme & direction before paint to avoid flashes.
      try {
        var t = localStorage.getItem('welco.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('welco.locale');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- ── Distinctive Neon Splash Screen ─────────────────────────────────── -->
    <div id="glitchfix-splash" role="presentation" aria-label="GlitchFix Splash Screen">
      <div class="gf-grid"></div>
      <div class="gf-aurora-cyan"></div>
      <div class="gf-aurora-purple"></div>
      <div class="gf-scanline"></div>

      <div class="gf-content">
        <!-- Neon Emblem -->
        <div class="gf-logo-box">
          <div class="gf-logo-halo"></div>

          <!-- Client documents flying into the emblem (decorative) -->
          <div class="gf-papers" aria-hidden="true">
            <div class="gf-paper-slot" style="--sx: calc(var(--gf-dx) * -1); --sy: -48px; --rot: -20deg; --c: 0, 240, 255; --delay: 0.1s"><div class="gf-paper"><i></i></div></div>
            <div class="gf-paper-slot" style="--sx: calc(var(--gf-dx) * 0.9); --sy: 36px; --rot: 16deg; --c: 129, 140, 248; --delay: 0.36s"><div class="gf-paper gf-paper--img"><i></i></div></div>
            <div class="gf-paper-slot" style="--sx: calc(var(--gf-dx) * -0.8); --sy: 50px; --rot: 12deg; --c: 217, 70, 239; --delay: 0.62s"><div class="gf-paper"><i></i></div></div>
            <div class="gf-paper-slot" style="--sx: calc(var(--gf-dx) * 1.1); --sy: -62px; --rot: -14deg; --c: 0, 240, 255; --delay: 0.88s"><div class="gf-paper gf-paper--img"><i></i></div></div>
            <div class="gf-paper-slot" style="--sx: calc(var(--gf-dx) * -1.1); --sy: -8px; --rot: -8deg; --c: 129, 140, 248; --delay: 1.14s"><div class="gf-paper"><i></i></div></div>
            <div class="gf-paper-slot" style="--sx: calc(var(--gf-dx) * 0.8); --sy: 44px; --rot: 22deg; --c: 217, 70, 239; --delay: 1.4s"><div class="gf-paper"><i></i></div></div>
          </div>

          <img class="gf-logo-svg" src="/icons/logo-mark.png" alt="" width="104" height="104" decoding="async" />
        </div>

        <!-- Glowing Neon Titles -->
        <div class="gf-brand-en">GLITCHFIX</div>
        <div class="gf-brand-ar">جليتش فيكس</div>

        <!-- System Status Pill -->
        <div class="gf-tagline-chip">
          <span class="gf-dot"></span>
          <span class="gf-tagline-text">SYSTEM ONLINE · إصلاح الأنظمة</span>
        </div>

        <!-- Code window: lines are typed in by the script below (decorative) -->
        <div class="gf-code" aria-hidden="true">
          <div class="gf-code-bar"><i></i><i></i><i></i><span class="gf-code-file">fix-site.ts</span></div>
          <div class="gf-code-body" id="gf-code-body"></div>
        </div>

        <!-- Neon Laser Progress Bar -->
        <div class="gf-laser-track">
          <div class="gf-laser-bar"></div>
        </div>

        <!-- Tap hint -->
        <div class="gf-hint">اضغط للدخول فوراً · Tap to enter</div>
      </div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('glitchfix-splash');
        if (!splash) return;

        var reduceMotion = false;
        try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

        var dismissed = false;
        var frame = 0;
        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          if (frame) cancelAnimationFrame(frame);
          splash.classList.add('gf-exit');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 680);
        }

        // Tap/click to bypass immediately
        splash.addEventListener('click', dismiss);
        splash.addEventListener('touchstart', dismiss, { passive: true });

        // Auto dismiss once the intro has played (the story below is timed to finish just before this)
        var timer = setTimeout(dismiss, reduceMotion ? 1200 : 3000);

        // Expose global for React to signal when loaded
        window.__dismissGlitchFixSplash = function () {
          clearTimeout(timer);
          dismiss();
        };

        // ── Code window: types itself while the client papers fly into the emblem ──
        var host = document.getElementById('gf-code-body');
        if (!host) return;

        // [token class, text]: k keyword, f function, v identifier, p punctuation, s literal, ok success
        var SNIPPET = [
          [['k', 'const '], ['v', 'brief'], ['p', ' = '], ['k', 'await '], ['f', 'discover'], ['p', '('], ['v', 'idea'], ['p', ');']],
          [['k', 'const '], ['v', 'spec'], ['p', ' = '], ['v', 'brief'], ['p', '.'], ['f', 'toSpec'], ['p', '();']],
          [['k', 'await '], ['f', 'fix'], ['p', '('], ['v', 'site'], ['p', ', { '], ['v', 'ai'], ['p', ': '], ['s', 'true'], ['p', ' });']],
          [['ok', '✓ glitch fixed · deployed']]
        ];
        var START_MS = 650;  // after the window has faded in
        var CHAR_MS = 10;    // base time per character
        var LINE_PAUSE_MS = 90;

        var caret = document.createElement('span');
        caret.className = 'gf-caret';

        // Build every line up front so nothing reflows, and schedule each character on a timeline.
        var steps = [];
        var lineEls = [];
        var at = START_MS;
        SNIPPET.forEach(function (tokens, n) {
          var row = document.createElement('div');
          row.className = 'gf-code-line';
          var num = document.createElement('span');
          num.className = 'gf-ln';
          num.textContent = String(n + 1);
          var text = document.createElement('span');
          text.className = 'gf-code-text';
          row.appendChild(num);
          row.appendChild(text);
          host.appendChild(row);
          lineEls.push(text);
          tokens.forEach(function (tok) {
            var el = document.createElement('span');
            el.className = tok[0];
            text.appendChild(el);
            for (var i = 0; i < tok[1].length; i++) {
              steps.push({ at: at, el: el, ch: tok[1].charAt(i), line: text });
              at += CHAR_MS + (steps.length * 7) % 7; // deterministic, slightly uneven rhythm
            }
          });
          at += LINE_PAUSE_MS;
        });

        if (reduceMotion) {
          steps.forEach(function (s) { s.el.textContent += s.ch; });
          lineEls[lineEls.length - 1].appendChild(caret);
          return;
        }

        // Time-based (not tick-based): if the main thread is busy parsing the app bundle and a frame
        // is late, the next frame simply catches up instead of the typing drifting behind the papers.
        var t0 = performance.now();
        var cursor = 0;
        lineEls[0].appendChild(caret);
        function type() {
          var elapsed = performance.now() - t0;
          var last = null;
          while (cursor < steps.length && steps[cursor].at <= elapsed) {
            last = steps[cursor++];
            last.el.textContent += last.ch;
          }
          if (last) last.line.appendChild(caret);
          if (cursor < steps.length && !dismissed) frame = requestAnimationFrame(type);
        }
        frame = requestAnimationFrame(type);
      })();
    </script>

    <div id="root"><!--static-seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
