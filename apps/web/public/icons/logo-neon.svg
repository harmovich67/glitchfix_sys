<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d1b" />
      <stop offset="50%" stop-color="#06070f" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="25%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-magenta" cx="75%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Stroke Gradients -->
    <linearGradient id="neon-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neon-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <linearGradient id="neon-lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-filter-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feGaussianBlur stdDeviation="3" result="blur3" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Ambient Glow Orbs -->
  <rect width="512" height="512" rx="112" fill="url(#glow-cyan)" />
  <rect width="512" height="512" rx="112" fill="url(#glow-magenta)" />

  <!-- Subtle Cyber Tech Frame Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#neon-primary)" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="14 10" />

  <!-- Corner Tech Accent Brackets -->
  <path d="M 64 100 L 64 64 L 100 64" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 448 100 L 448 64 L 412 64" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 64 412 L 64 448 L 100 448" fill="none" stroke="#d946ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M 448 412 L 448 448 L 412 448" fill="none" stroke="#d946ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Outer Neon Diamond/Hexagon Shield -->
  <g filter="url(#neon-filter-intense)">
    <!-- Cyan glow outer shield -->
    <path d="M 256 68 L 420 162 L 420 350 L 256 444 L 92 350 L 92 162 Z"
          fill="none"
          stroke="url(#neon-primary)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9" />

    <!-- Core white neon tube for outer shield -->
    <path d="M 256 68 L 420 162 L 420 350 L 256 444 L 92 350 L 92 162 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95" />
  </g>

  <!-- Inner GlitchFix Iconic Emblem: 'G' + 'F' Lightning Bolt -->
  <g filter="url(#neon-filter-intense)">
    <!-- Cyber 'G' Arc: Glowing Cyan and Violet -->
    <!-- Top arc -> left side -> bottom arc -> inward repair bar -->
    <path d="M 345 180
             L 280 180
             A 84 84 0 0 0 172 256
             A 84 84 0 0 0 256 340
             L 326 340
             L 326 270
             L 260 270"
          fill="none"
          stroke="url(#neon-cyan)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Pure White Core for 'G' (Neon Tube Core) -->
    <path d="M 345 180
             L 280 180
             A 84 84 0 0 0 172 256
             A 84 84 0 0 0 256 340
             L 326 340
             L 326 270
             L 260 270"
          fill="none"
          stroke="#ffffff"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Dynamic Neon Lightning / Repair Bolt (Fixing the Glitch!) -->
    <!-- Piercing diagonally with electric energy -->
    <path d="M 320 130
             L 230 250
             L 285 250
             L 205 380"
          fill="none"
          stroke="url(#neon-magenta)"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Core White Neon Tube for Lightning Bolt -->
    <path d="M 320 130
             L 230 250
             L 285 250
             L 205 380"
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Accent Energy Dots (Glitch particles being fixed) -->
    <circle cx="366" cy="225" r="7" fill="#00f0ff" />
    <circle cx="366" cy="225" r="3" fill="#ffffff" />
    <circle cx="150" cy="210" r="6" fill="#d946ef" />
    <circle cx="150" cy="210" r="2.5" fill="#ffffff" />
    <circle cx="350" cy="305" r="5" fill="#00f0ff" />
    <circle cx="350" cy="305" r="2" fill="#ffffff" />
  </g>
</svg>
